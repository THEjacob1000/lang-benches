[package]
name = "gbb-rust"
version = "0.1.0"
edition = "2024"

[workspace]

[[bin]]
name = "rust-server"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
hmac = "0.13.0"
sha2 = "0.11.0"
mimalloc = "0.1.52"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
form_urlencoded = "1.2.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
